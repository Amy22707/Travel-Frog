<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#526b42"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><title>旅行青蛙·中国之旅</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon-192.png"><link id="manifest" rel="manifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#414b37;font:16px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
main{max-width:460px;margin:5vh auto;padding:24px 30px;text-align:center}h1{margin:0 0 12px}h1 img{width:min(100%,350px);height:auto}p{line-height:1.7;color:#59634c}
h1 span{font-size:clamp(20px,6.4vw,30px);display:block}#home.booting h1 span,#home:not(.booting) h1 img{display:none}
#home.booting :is(#create,#import,#export,#cache,#previous){display:none}
#loadingArt{margin:20px auto 30px}#loadingArt img{display:block;margin:0 auto;width:min(38vw,150px)}#loadingArt .frog{width:min(45vw,220px);aspect-ratio:280/118;margin:24px auto 0;background:url(game/startup/loading_dorai.png) center 66.7%/274.3% auto no-repeat}
#loadingArt .bar{width:min(100%,270px);height:22px;margin:18px auto 0;background:url(game/startup/loading_off.png) center/100% 100%}
#loadingArt .bar::before{content:"";display:block;height:100%;background:url(game/startup/loading_on.png) center/100% 100%;transform-origin:left;animation:read 1.7s ease-out both}
@keyframes read{from{transform:scaleX(.16)}to{transform:scaleX(.94)}}
button{border:0;border-radius:16px;padding:15px 22px;background:#526b42;color:white;font:inherit;cursor:pointer;margin:7px 0;width:100%}
button.secondary{background:#e9e4cf;color:#526b42}button:disabled{opacity:.45}
#gameViewport{position:fixed;inset:0;display:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:transparent transparent}
body.playing #gameViewport{display:block}
#gameViewport:hover{scrollbar-color:#526b4266 transparent}
#gameViewport::-webkit-scrollbar{height:6px}
#gameViewport::-webkit-scrollbar-thumb{background:transparent;border-radius:6px}
#gameViewport::-webkit-scrollbar-thumb:hover,#gameViewport::-webkit-scrollbar-thumb:active{background:#526b4288}
#game{display:block;width:100%;min-width:56.338vh;height:100%;border:0;background:#f6f1de}#manage{display:none;position:fixed;z-index:2;bottom:calc(8px + env(safe-area-inset-bottom));left:8px;width:auto;padding:6px 12px;font-size:12px;background:#f6f1ded9;color:#526b42;border:1px solid #a7ad90}
#progress{font-size:14px}#progress:empty{display:none}input{display:none}
#rotate{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:24px;background:#f6f1de;font-size:clamp(24px,4vw,34px);line-height:1.5;font-weight:600}
@media (orientation:landscape){body.playing #gameViewport,body.playing #manage{visibility:hidden}body.playing #rotate{display:grid}}
</style></head><body>
<main id="home" class="booting"><h1><img src="game/startup/new_title.png" alt="旅行青蛙·中国之旅"><span>旅行青蛙·中国之旅</span></h1><p id="editionName" hidden>图鉴版</p>
<div id="loadingArt" role="status" aria-label="正在读取中"><img src="game/startup/loading.png" alt=""><div class="bar"></div><div class="frog"></div></div>
<p id="progress" role="status"></p>
<button id="play" disabled>点击进入游戏</button><button id="create" class="secondary" disabled>开始新的旅程</button>
<button id="import" class="secondary" disabled>导入存档</button><input id="file" type="file" accept=".frogsave,.json,.jsonl">
<button id="export" class="secondary" disabled>导出存档</button><button id="cache" class="secondary" hidden>下载离线资源</button>
<button id="previous" class="secondary" disabled>导出上次导入前的备份</button>
</main><div id="gameViewport"><iframe id="game" title="旅行青蛙·中国之旅"></iframe></div><button id="manage">存档</button>
<div id="rotate" role="status">请旋转设备，或将浏览器窗口调整为竖屏比例。</div>
<script src="phone.js"></script></body></html>
