name: Build macOS installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the tested DMGs to v0.2.4
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Download published game resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.4 --pattern 'TravelFrog*-Windows.zip' --dir "$RUNNER_TEMP/frog-archives"
      - name: Build the two editions
        run: python packaging/build_macos.py --archives "$RUNNER_TEMP/frog-archives" --output "$RUNNER_TEMP/frog-dmg"
      - name: Test the mounted installers
        run: python packaging/test_macos.py "$RUNNER_TEMP/frog-dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: TravelFrog-macOS-${{ matrix.architecture }}
          path: ${{ runner.temp }}/frog-dmg/*.dmg
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: TravelFrog-macOS-*
          merge-multiple: true
          path: dmg
      - name: Attach the four tested installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(dmg/*.dmg)
          test "${#files[@]}" -eq 4
          gh release upload v0.2.4 "${files[@]}"
